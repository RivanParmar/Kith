hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }
hilt-ext-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Plugins defined by this project
kith-android-application = { id = "kith.android.application" }
kith-android-application-compose = { id = "kith.android.application.compose" }
kith-android-feature = { id = "kith.android.feature" }
kith-android-library = { id = "kith.android.library" }
kith-android-library-compose = { id = "kith.android.library.compose" }
kith-hilt = { id = "kith.hilt" }
kith-jvm-library = { id = "kith.jvm.library" }