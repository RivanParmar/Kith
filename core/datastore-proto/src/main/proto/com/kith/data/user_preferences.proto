syntax = "proto3";

option java_package = "com.kith.data";
option java_multiple_files = true;

import "com/kith/data/dark_theme_config.proto";
import "com/kith/data/profile_visibility.proto";

// NEXT AVAILABLE ID: 5
message UserPreferences {
  DarkThemeConfigProto dark_theme_config = 1;
  ProfileVisibilityProto profile_visibility = 2;
  bool push_notifications_enabled = 3;
  bool has_done_onboarding = 4;
  int64 last_login_timestamp = 5;
}